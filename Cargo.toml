[workspace]
members = [
    "crates/ucode-core",
    "crates/ucode-auth",
    "crates/ucode-providers",
    "crates/ucode-tools",
    "crates/ucode-mcp",
    "crates/ucode-skills",
    "crates/ucode-plugins",
    "crates/ucode-tui",
    "crates/ucode-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ucode contributors"]
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# async streams
futures-core = "0.3"
futures-util = "0.3"

# time
chrono = { version = "0.4", features = ["serde"] }

# random
rand = "0.9"

# file-system walking (gitignore-aware)
ignore = "0.4"

# AST structural search/rewrite
ast-grep-core = "0.41"
ast-grep-language = "0.41"

# patch application with fuzzy context matching
mpatch = "1"

# regex
regex = "1"

# testing
tempfile = "3"

# keychain
keyring = { version = "3", features = ["apple-native", "linux-native"] }

# git (pure Rust)
gix = { version = "0.80", default-features = false, features = ["status", "blob-diff", "index"] }

# intra-workspace
ucode-core = { path = "crates/ucode-core" }
ucode-auth = { path = "crates/ucode-auth" }
