[workspace]
members = [
    "crates/ucode-core",
    "crates/ucode-auth",
    "crates/ucode-providers",
    "crates/ucode-tools",
    "crates/ucode-mcp",
    "crates/ucode-skills",
    "crates/ucode-plugins",
    "crates/ucode-plugin-sdk",
    "crates/ucode-themes",
    "crates/ucode-tui",
    "crates/ucode-cli",
    "crates/ucode-context",
    "crates/ucode-agent",
    "examples/plugins/hello-wasm",
]
# hello-wasm is a WASM component plugin -- must be built with
# --target wasm32-wasip1, so exclude it from default workspace builds.
default-members = [
    "crates/ucode-core",
    "crates/ucode-auth",
    "crates/ucode-providers",
    "crates/ucode-tools",
    "crates/ucode-mcp",
    "crates/ucode-skills",
    "crates/ucode-plugins",
    "crates/ucode-plugin-sdk",
    "crates/ucode-themes",
    "crates/ucode-tui",
    "crates/ucode-cli",
    "crates/ucode-context",
    "crates/ucode-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ucode contributors"]
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# async streams
futures-core = "0.3"
futures-util = "0.3"

# cancellation / sync utilities
tokio-util = "0.7"

# time
chrono = { version = "0.4", features = ["serde"] }

# random
rand = "0.9"

# file-system walking (gitignore-aware)
ignore = "0.4"

# AST structural search/rewrite
ast-grep-core = "0.41"
ast-grep-language = "0.41"

# patch application with fuzzy context matching
mpatch = "1"

# regex
regex = "1"

# HTTP client (MCP SSE + HTTP transports)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# config
toml = "0.8"

# testing
tempfile = "3"

# keychain
keyring = { version = "3", features = ["apple-native", "linux-native"] }

# git (pure Rust)
gix = { version = "0.80", default-features = false, features = ["status", "blob-diff", "index"] }

# unicode width (for text measurement in TUI)
unicode-width = "0.2"

# WASM plugin runtime
wasmtime = { version = "42", features = ["component-model"] }
wasmtime-wasi = "42"

# Ed25519 signature verification for signed plugins
ed25519-dalek = { version = "2", features = ["std"] }

# WASM guest SDK (for plugin authors)
wit-bindgen = "0.53"

# sqlite / vector search
rusqlite = { version = "0.35", features = ["bundled", "column_decltype"] }
sqlite-vec = "0.1.7-alpha.10"
zerocopy = { version = "0.8", features = ["derive"] }

# intra-workspace
ucode-core = { path = "crates/ucode-core" }
ucode-auth = { path = "crates/ucode-auth" }
ucode-providers = { path = "crates/ucode-providers" }
ucode-tools = { path = "crates/ucode-tools" }
ucode-themes = { path = "crates/ucode-themes" }
ucode-tui = { path = "crates/ucode-tui" }
ucode-agent = { path = "crates/ucode-agent" }
