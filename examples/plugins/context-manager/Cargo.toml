[package]
name = "context-manager-plugin"
version = "0.1.0"
edition = "2021"
description = "Demo plugin: deduplicates messages, provides context stats tool"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
